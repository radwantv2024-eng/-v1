function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function getCurrentMonthKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function getDateOffset(daysAgo) {
  const d = new Date();
  d.setDate(d.getDate() - daysAgo);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function formatAmount(num) {
  const rounded = Math.round((num + Number.EPSILON) * 100) / 100;
  return rounded % 1 === 0 ? String(rounded) : rounded.toFixed(2);
}

function formatDate(dateStr) {
  const bits = dateStr.split('-').map(Number);
  return `${bits[2]} ${LEVANT_MONTHS[bits[1] - 1]}`;
}

function getMonthKey(dateStr) {
  return dateStr.slice(0, 7);
}

function formatMonthKey(key) {
  const bits = key.split('-').map(Number);
  return `${LEVANT_MONTHS[bits[1] - 1]} ${bits[0]}`;
}

function getMonthBounds(monthKey) {
  const bits = monthKey.split('-').map(Number);
  const y = bits[0];
  const m = bits[1];
  const first = `${monthKey}-01`;
  const lastDay = new Date(y, m, 0).getDate();
  const last = `${monthKey}-${String(lastDay).padStart(2, '0')}`;
  return { first, last };
}

function describeRange(from, to) {
  if (!from || !to) return '';
  const monthKey = from.slice(0, 7);
  const bounds = getMonthBounds(monthKey);
  if (from === bounds.first && to === bounds.last) return formatMonthKey(monthKey);
  return `${formatDate(from)} — ${formatDate(to)}`;
}

function escapeHtml(str) {

function buildRingGradient(data, total) {
  if (total <= 0 || data.length === 0) {
    return `repeating-conic-gradient(from 0deg, ${COLORS.gold} 0deg 2.4deg, #7d631c 2.4deg 4.8deg)`;
  }
  let cumulative = 0;
  const stops = data.map((d) => {
    const start = (cumulative / total) * 360;
    cumulative += d.value;
    const end = (cumulative / total) * 360;
    return `${d.color} ${start}deg ${end}deg`;
  });
  return `conic-gradient(${stops.join(', ')})`;
}

function useCountUp(value, duration = 650) {
  const [display, setDisplay] = useState(value);
  const prevValue = useRef(value);
  const rafRef = useRef(null);

  useEffect(() => {
    const prefersReduced =
      typeof window !== 'undefined' &&
      window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (prefersReduced) {
      setDisplay(value);
      prevValue.current = value;
      return undefined;
    }

    const start = prevValue.current;
    const end = value;
    const startTime = performance.now();
    cancelAnimationFrame(rafRef.current);

    function tick(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setDisplay(start + (end - start) * eased);
      if (progress < 1) {
        rafRef.current = requestAnimationFrame(tick);
      } else {
        prevValue.current = end;
        setDisplay(end);
      }
    }
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [value, duration]);

  return display;
}

function useLongPress(onLongPress, onClick, enabled, ms = 550) {
  const [pressing, setPressing] = useState(false);
  const timerRef = useRef(null);
  const firedRef = useRef(false);

  const start = () => {
    if (!enabled) return;
    firedRef.current = false;
    setPressing(true);
    timerRef.current = setTimeout(() => {
      firedRef.current = true;
      setPressing(false);
      onLongPress();
    }, ms);
  };
  const clear = () => {
    setPressing(false);
    if (timerRef.current) clearTimeout(timerRef.current);
  };
  const handleClick = () => {
    if (firedRef.current) {
      firedRef.current = false;
      return;
    }
    onClick();
  };

  return {
    pressing,
    onMouseDown: start,
    onMouseUp: clear,
    onMouseLeave: clear,
    onTouchStart: start,
    onTouchEnd: clear,
    onTouchCancel: clear,
    onClick: handleClick,
    onContextMenu: (e) => enabled && e.preventDefault(),
  };
}

  const totalDeposits = deposits.reduce((s, d) => s + d.amount, 0);

  const sortByDateDesc = (a, b) => (a.date === b.date ? b.id.localeCompare(a.id) : b.date.localeCompare(a.date));

  const totalStr = formatAmount(animatedTotal);

  const chartSource =

                          style={{ width: 96, background: 'rgba(255,255,255,0.04)', color: COLORS.textPrimary, border: '1px solid rgba(255,255,255,0.08)', fontFamily: "'IBM Plex Mono', monospace", fontSize: 13 }}
                        />
                        <span style={{ color: COLORS.textMuted, fontFamily: "'Cairo', sans-serif", fontSize: 12 }}>{CURRENCY}</span>
                      </div>
                    </div>
                  ))}
                </div>
                <p className="mt-2" style={{ color: COLORS.textFaint, fontFamily: "'Cairo', sans-serif", fontSize: 11 }}>
                  اترك الخانة فاضية لإلغاء الحد. بيتنبّهك التطبيق إذا تجاوزت الحد بالدورة الحالية.
                </p>
              </div>
            </div>
          )}

          {/* Export options modal */}
          {showExportModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-5" style={{ background: 'rgba(0,0,0,0.62)' }} onClick={() => setShowExportModal(false)}>
              <div className="w-full max-w-xs rounded-2xl p-5" style={{ background: COLORS.surface, border: '1px solid rgba(201,162,39,0.28)' }} onClick={(e) => e.stopPropagation()}>
                <div className="flex items-start justify-between mb-4">
                  <h3 className="font-semibold" style={{ color: COLORS.textPrimary, fontFamily: "'Cairo', sans-serif", fontSize: 15 }}>
                    تنزيل كشف الأغراض
                  </h3>
                  <button type="button" onClick={() => setShowExportModal(false)} aria-label="إغلاق">
                    <X size={16} style={{ color: COLORS.textMuted }} />
                  </button>
                </div>

                <div className="mb-1.5" style={{ color: COLORS.textMuted, fontFamily: "'Cairo', sans-serif", fontSize: 12 }}>
                  المجال الزمني
                </div>
                <DateRangeFields from={exportFrom} to={exportTo} onFrom={setExportFrom} onTo={setExportTo} />

                <div className="mb-1.5" style={{ color: COLORS.textMuted, fontFamily: "'Cairo', sans-serif", fontSize: 12 }}>
                  الصيغة
                </div>
                <div className="flex gap-1.5 mb-4">
                  {[{ id: 'excel', label: 'إكسل' }, { id: 'pdf', label: 'PDF' }].map((f) => {
                    const active = exportFormat === f.id;
                    return (
                      <button
                        key={f.id}
                        type="button"
                        onClick={() => setExportFormat(f.id)}
                        className="flex-1 py-2 rounded-xl"
                        style={{
                          background: active ? COLORS.gold : 'rgba(255,255,255,0.04)',
                          color: active ? COLORS.bg : COLORS.textMuted,
                          border: `1px solid ${active ? COLORS.gold : 'rgba(255,255,255,0.08)'}`,
                          fontFamily: "'Cairo', sans-serif",
                          fontSize: 13,
                          fontWeight: active ? 700 : 400,
                        }}
                      >
                        {f.label}
                      </button>
                    );
                  })}
                </div>

                <div className="mb-1.5" style={{ color: COLORS.textMuted, fontFamily: "'Cairo', sans-serif", fontSize: 12 }}>
                  لمين
                </div>
                <div className="flex flex-wrap gap-1.5 mb-5">
                  {EXPORT_SCOPES.map((s) => {
                    const active = exportScope === s.id;
                    return (
                      <button
                        key={s.id}
                        type="button"
                        onClick={() => setExportScope(s.id)}
                        className="px-3 py-1.5 rounded-xl"
                        style={{
                          background: active ? COLORS.gold : 'rgba(255,255,255,0.04)',
                          color: active ? COLORS.bg : COLORS.textMuted,
                          border: `1px solid ${active ? COLORS.gold : 'rgba(255,255,255,0.08)'}`,
                          fontFamily: "'Cairo', sans-serif",
                          fontSize: 12,
                          fontWeight: active ? 700 : 400,
                        }}
                      >
                        {s.label}
                      </button>
                    );
                  })}
                </div>

                <p className="mb-3" style={{ color: COLORS.textFaint, fontFamily: "'Cairo', sans-serif", fontSize: 11 }}>
                  رح ينزل كشف {exportRangeLabel}
                  {exportList.length === 0 ? ` — ما في عناصر بهالمجال` : ` (${exportList.length} غرض)`}
                </p>

                <button
                  type="button"
                  onClick={handleExportConfirm}
                  disabled={exportList.length === 0}
                  className="w-full py-3 rounded-xl font-semibold"
                  style={{
                    background: COLORS.gold,
                    color: COLORS.bg,
                    fontFamily: "'Cairo', sans-serif",
                    fontSize: 14,
                    opacity: exportList.length === 0 ? 0.45 : 1,
                    cursor: exportList.length === 0 ? 'not-allowed' : 'pointer',
                  }}
                >
                  تنزيل
                </button>
              </div>
            </div>
          )}

          {/* Reset confirmation modal */}
          {showResetConfirm && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-5" style={{ background: 'rgba(0,0,0,0.62)' }} onClick={() => setShowResetConfirm(false)}>
              <div className="w-full max-w-xs rounded-2xl p-5" style={{ background: COLORS.surface, border: '1px solid rgba(201,162,39,0.28)' }} onClick={(e) => e.stopPropagation()}>
                <div className="flex items-start justify-between mb-3">
                  <h3 className="font-semibold" style={{ color: COLORS.textPrimary, fontFamily: "'Cairo', sans-serif", fontSize: 15 }}>
                    تصفير الدورة الحالية؟
                  </h3>
                  <button type="button" onClick={() => setShowResetConfirm(false)} aria-label="إغلاق">
                    <X size={16} style={{ color: COLORS.textMuted }} />
                  </button>
                </div>
                <p className="mb-5" style={{ color: COLORS.textMuted, fontFamily: "'Cairo', sans-serif", fontSize: 13 }}>
                  رح يتحفظ الناتج (مصاريف {formatAmount(activeExpensesTotal)} {CURRENCY}، إيداعات {formatAmount(totalDeposits)} {CURRENCY}) بقائمة "دورات سابقة"، وتنمسح كل العناصر الحالية. متأكد؟
                </p>
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => setShowResetConfirm(false)}
                    className="flex-1 py-2.5 rounded-xl"
                    style={{ background: 'rgba(255,255,255,0.06)', color: COLORS.textPrimary, fontFamily: "'Cairo', sans-serif", fontSize: 13 }}
                  >
                    إلغاء
                  </button>
                  <button
                    type="button"
                    onClick={handleReset}
                    className="flex-1 py-2.5 rounded-xl font-semibold"
                    style={{ background: COLORS.danger, color: '#fff', fontFamily: "'Cairo', sans-serif", fontSize: 13 }}
                  >
                    تصفير
                  </button>
                </div>
              </div>
            </div>
          )}
      </>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<HouseholdExpenses />);
window.__appMounted = true;
</script>
<script>
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
</html>
